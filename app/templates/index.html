<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地址匹配 · Address Matcher</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
    <h1>地址匹配台 <span class="sub">Address Matcher</span></h1>
    <div class="health">
        <span id="health" class="badge">连接中…</span>
        <a href="/docs" target="_blank" class="link">REST API 文档</a>
    </div>
</header>

<nav class="tabs">
    <button class="tab active" data-tab="match">单条 / 批量匹配</button>
    <button class="tab" data-tab="table">标准地址表 <span id="addr-count" class="count"></span></button>
    <button class="tab" data-tab="review">待确认队列 <span id="review-count" class="count"></span></button>
</nav>

<main>
    <!-- ============================ matching ============================ -->
    <section id="tab-match" class="panel active">
        <div class="card">
            <h2>外部地址输入</h2>
            <p class="hint">每行一条地址；或直接粘贴一条。系统会自动统一 Unicode、大小写、道路缩写与门牌号格式。</p>
            <textarea id="query" rows="4"
                placeholder="例如：123 main street, New York, NY 10001"></textarea>
            <div class="row">
                <button id="btn-match" class="primary">开始匹配</button>
                <button id="btn-demo" class="ghost">填充示例</button>
                <span id="match-summary"></span>
            </div>
        </div>
        <div id="results"></div>
    </section>

    <!-- ====================== standard address table =================== -->
    <section id="tab-table" class="panel">
        <div class="card">
            <h2>标准地址表</h2>
            <div class="row wrap">
                <input type="file" id="csv-file" accept=".csv" class="hidden-file">
                <label for="csv-file" class="btn ghost-file">上传 CSV</label>
                <button id="btn-sample" class="ghost">加载内置示例数据</button>
                <button id="btn-refresh-table" class="ghost">刷新</button>
                <span id="table-msg"></span>
            </div>
            <p class="hint">
                CSV 支持的列名：<code>address</code>(或 full_address)、<code>line1</code>(street)、
                <code>city</code>(town)、<code>state</code>(province)、
                <code>postal_code</code>(zip/postcode)、<code>country</code>、
                <code>external_id</code>(或 id)。
            </p>
            <div id="address-table-wrap" class="table-wrap"></div>
        </div>
    </section>

    <!-- ========================== review queue ========================= -->
    <section id="tab-review" class="panel">
        <div class="card">
            <h2>待确认队列</h2>
            <div class="row">
                <select id="review-filter">
                    <option value="needs_review">仅待确认</option>
                    <option value="">全部记录</option>
                    <option value="reviewed">已复核</option>
                    <option value="auto_matched">自动命中</option>
                    <option value="no_match">无匹配</option>
                </select>
                <button id="btn-refresh-review" class="ghost">刷新</button>
            </div>
            <div id="review-list"></div>
        </div>
    </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
